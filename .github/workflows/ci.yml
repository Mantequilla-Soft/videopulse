name: CI

# Tests on every push and PR. The box deploys a main commit only after this
# workflow's `test` job has passed on it (scripts/deploy.sh checks).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Cache MongoDB binary (mongodb-memory-server)
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm test
        env:
          MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
